name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the tag matches the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      # prepublishOnly runs the checks and prepack builds. No token is needed, since npm uses
      # the OIDC trusted publisher, and it adds provenance automatically.
      # Skipped when the version is already on npm, e.g. published by hand or by an earlier run,
      # so that the GitHub release is still created.
      - name: Publish to npm
        run: |
          PACKAGE="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if [ -n "$(npm view "$PACKAGE" version 2>/dev/null)" ]; then
            echo "$PACKAGE is already on npm"
          else
            npm publish
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
